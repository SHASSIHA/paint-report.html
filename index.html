<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
font-family:'Cairo',sans-serif;
direction:rtl;
color:white;
}

.container{
max-width:430px;
margin:auto;
padding:15px;
}

.header{
text-align:center;
font-size:28px;
font-weight:700;
margin:20px 0;
}

.card{
background:#1e293b;
border-radius:24px;
padding:18px;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.title{
font-size:18px;
font-weight:700;
margin-bottom:15px;
}

.input{
width:100%;
padding:14px;
background:#111827;
border:none;
border-radius:14px;
color:white;
margin-bottom:10px;
font-size:14px;
outline:none;
}

.input::placeholder{
color:#94a3b8;
}

/* CAR */

.car-container{
position:relative;
width:260px;
height:500px;
margin:auto;
margin-top:20px;
}

/* PARTS */

.part{
position:absolute;
background:#22c55e;
border:none;
border-radius:18px;
cursor:pointer;
transition:0.2s;
box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

.part:hover{
transform:scale(1.03);
}

/* FRONT */

.hood{
width:150px;
height:55px;
top:55px;
left:55px;
border-radius:22px;
}

/* ROOF */

.roof{
width:120px;
height:180px;
top:135px;
left:70px;
border-radius:28px;
}

/* TRUNK */

.trunk{
width:150px;
height:55px;
bottom:45px;
left:55px;
border-radius:22px;
}

/* LEFT SIDE */

.lf-fender{
width:45px;
height:55px;
top:120px;
left:25px;
}

.lf-door{
width:45px;
height:90px;
top:190px;
left:20px;
}

.lr-door{
width:45px;
height:90px;
top:300px;
left:20px;
}

.lr-fender{
width:45px;
height:55px;
top:410px;
left:25px;
}

/* RIGHT SIDE */

.rf-fender{
width:45px;
height:55px;
top:120px;
right:25px;
}

.rf-door{
width:45px;
height:90px;
top:190px;
right:20px;
}

.rr-door{
width:45px;
height:90px;
top:300px;
right:20px;
}

.rr-fender{
width:45px;
height:55px;
top:410px;
right:25px;
}

/* LEGEND */

.legend{
margin-top:20px;
}

.legend-item{
display:flex;
align-items:center;
margin-bottom:10px;
}

.legend-color{
width:18px;
height:18px;
border-radius:50%;
margin-left:10px;
}

/* NOTES */

.notes{
width:100%;
height:90px;
background:#111827;
border:none;
border-radius:14px;
padding:12px;
color:white;
resize:none;
outline:none;
font-family:'Cairo',sans-serif;
}

/* BUTTON */

.btn{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#f97316,#ea580c);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* PRINT */

@media print{

body{
background:white;
}

.btn{
display:none;
}

.card{
box-shadow:none;
break-inside:avoid;
page-break-inside:avoid;
}

@page{
margin:10mm;
}

}

/* FOOTER */

.footer{
text-align:center;
color:#64748b;
margin:15px 0;
font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
🚗 SHASSIHA
</div>

<!-- INFO -->

<div class="card">

<div class="title">
معلومات السيارة
</div>

<input class="input" placeholder="رقم الشاصي VIN">

<input class="input" placeholder="اسم السيارة">

<input class="input" placeholder="الموديل">

<input class="input" placeholder="العداد / الممشى">

</div>

<!-- CAR -->

<div class="card">

<div class="title">
مخطط الصبغ
</div>

<div class="car-container">

<button class="part hood" onclick="changeColor(this)"></button>

<button class="part roof" onclick="changeColor(this)"></button>

<button class="part trunk" onclick="changeColor(this)"></button>

<button class="part lf-fender" onclick="changeColor(this)"></button>

<button class="part lf-door" onclick="changeColor(this)"></button>

<button class="part lr-door" onclick="changeColor(this)"></button>

<button class="part lr-fender" onclick="changeColor(this)"></button>

<button class="part rf-fender" onclick="changeColor(this)"></button>

<button class="part rf-door" onclick="changeColor(this)"></button>

<button class="part rr-door" onclick="changeColor(this)"></button>

<button class="part rr-fender" onclick="changeColor(this)"></button>

</div>

<!-- LEGEND -->

<div class="legend">

<div class="legend-item">
<div class="legend-color" style="background:#22c55e"></div>
أصلي
</div>

<div class="legend-item">
<div class="legend-color" style="background:#eab308"></div>
صبغ وكالة
</div>

<div class="legend-item">
<div class="legend-color" style="background:#f97316"></div>
مرشوش
</div>

<div class="legend-item">
<div class="legend-color" style="background:#ef4444"></div>
معجون
</div>

</div>

</div>

<!-- NOTES -->

<div class="card">

<div class="title">
ملاحظات
</div>

<textarea class="notes" placeholder="اكتب الملاحظات هنا..."></textarea>

<button class="btn" onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

let current = getComputedStyle(element).backgroundColor;

if(current == "rgb(34, 197, 94)"){
element.style.background = "#eab308";
}

else if(current == "rgb(234, 179, 8)"){
element.style.background = "#f97316";
}

else if(current == "rgb(249, 115, 22)"){
element.style.background = "#ef4444";
}

else{
element.style.background = "#22c55e";
}

}

</script>

</body>
</html>
