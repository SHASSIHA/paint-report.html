<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Inspection</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    direction:rtl;
}

.container{
    max-width:430px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu{
    font-size:24px;
}

/* SEARCH */

.search-box{
    background:#1e293b;
    padding:15px;
    border-radius:20px;
    margin-top:20px;
}

.search-title{
    margin-bottom:15px;
    font-size:18px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#334155;
    color:white;
    margin-bottom:10px;
    font-size:15px;
}

input::placeholder{
    color:#cbd5e1;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* STATUS */

.status-card{
    background:#1e293b;
    margin-top:20px;
    border-radius:20px;
    padding:18px;
}

.status-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.score{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

/* CAR */

.car-box{
    position:relative;
    margin-top:30px;
    display:flex;
    justify-content:center;
}

.car-image{
    width:220px;
}

/* PARTS */

.part{
    position:absolute;
    background:#22c55e;
    color:white;
    padding:8px 10px;
    border-radius:12px;
    font-size:11px;
    cursor:pointer;
    transition:0.2s;
    text-align:center;
    min-width:70px;
}

.part:hover{
    transform:scale(1.05);
}

/* POSITIONS */

.hood{
    top:5px;
}

.roof{
    top:110px;
}

.trunk{
    bottom:5px;
}

.lf-fender{
    top:110px;
    left:-5px;
}

.rf-fender{
    top:110px;
    right:-5px;
}

.lf-door{
    top:210px;
    left:-10px;
}

.rf-door{
    top:210px;
    right:-10px;
}

.lr-door{
    top:310px;
    left:-10px;
}

.rr-door{
    top:310px;
    right:-10px;
}

.lr-fender{
    top:410px;
    left:-5px;
}

.rr-fender{
    top:410px;
    right:-5px;
}

/* LEGEND */

.legend{
    margin-top:25px;
}

.legend-item{
    display:flex;
    align-items:center;
    margin-top:12px;
}

.color{
    width:18px;
    height:18px;
    border-radius:50%;
    margin-left:10px;
}

/* REPORT */

.report-btn{
    margin-top:25px;
}

.footer{
    text-align:center;
    margin-top:30px;
    margin-bottom:20px;
    color:#94a3b8;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
🚗 SHASSIHA
</div>

<div class="menu">
☰
</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<div class="search-title">
🔍 فحص السيارة
</div>

<input placeholder="رقم الشاصي VIN">

<input placeholder="اسم السيارة">

<button>
بحث
</button>

</div>

<!-- STATUS -->

<div class="status-card">

<div class="status-header">

<div>
<h3>حالة الصبغ</h3>
<p style="color:#94a3b8; margin-top:5px;">
Original Condition
</p>
</div>

<div class="score">
90%
</div>

</div>

<!-- CAR -->

<div class="car-box">

<img src="car-top.png" class="car-image">

<div class="part hood" onclick="changeColor(this)">
Hood
</div>

<div class="part roof" onclick="changeColor(this)">
Roof
</div>

<div class="part trunk" onclick="changeColor(this)">
Trunk
</div>

<div class="part lf-fender" onclick="changeColor(this)">
LF Fender
</div>

<div class="part rf-fender" onclick="changeColor(this)">
RF Fender
</div>

<div class="part lf-door" onclick="changeColor(this)">
LF Door
</div>

<div class="part rf-door" onclick="changeColor(this)">
RF Door
</div>

<div class="part lr-door" onclick="changeColor(this)">
LR Door
</div>

<div class="part rr-door" onclick="changeColor(this)">
RR Door
</div>

<div class="part lr-fender" onclick="changeColor(this)">
LR Fender
</div>

<div class="part rr-fender" onclick="changeColor(this)">
RR Fender
</div>

</div>

<!-- LEGEND -->

<div class="legend">

<div class="legend-item">
<div class="color" style="background:#22c55e"></div>
أصلي
</div>

<div class="legend-item">
<div class="color" style="background:#eab308"></div>
صبغ وكالة
</div>

<div class="legend-item">
<div class="color" style="background:#f97316"></div>
مرشوش
</div>

<div class="legend-item">
<div class="color" style="background:#ef4444"></div>
معجون
</div>

</div>

<div class="report-btn">

<button onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

    let current = getComputedStyle(element).backgroundColor;

    if(current == "rgb(34, 197, 94)"){
        element.style.background = "#eab308";
    }

    else if(current == "rgb(234, 179, 8)"){
        element.style.background = "#f97316";
    }

    else if(current == "rgb(249, 115, 22)"){
        element.style.background = "#ef4444";
    }

    else{
        element.style.background = "#22c55e";
    }
}

</script>

</body>
</html>
