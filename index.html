<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Inspection</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f3f4f6;
    direction:rtl;
}

.header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}

.container{
    max-width:500px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:22px;
    padding:18px;
    margin-top:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #ddd;
    margin-top:10px;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:#0f172a;
    color:white;
    font-size:16px;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.95;
}

.car-container{
    position:relative;
    margin-top:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.car-image{
    width:260px;
}

.part{
    position:absolute;
    background:#22c55e;
    color:white;
    padding:10px 12px;
    border-radius:12px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.part:hover{
    transform:scale(1.05);
}

/* أماكن القطع */

.hood{
    top:20px;
}

.roof{
    top:130px;
}

.trunk{
    bottom:20px;
}

.lf-fender{
    top:130px;
    left:0px;
}

.rf-fender{
    top:130px;
    right:0px;
}

.lf-door{
    top:240px;
    left:0px;
}

.rf-door{
    top:240px;
    right:0px;
}

.lr-door{
    top:350px;
    left:0px;
}

.rr-door{
    top:350px;
    right:0px;
}

.lr-fender{
    top:460px;
    left:0px;
}

.rr-fender{
    top:460px;
    right:0px;
}

.legend{
    margin-top:25px;
}

.legend-item{
    display:flex;
    align-items:center;
    margin-top:10px;
    gap:10px;
}

.color{
    width:18px;
    height:18px;
    border-radius:50%;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:13px;
    padding-bottom:20px;
}

</style>

</head>

<body>

<div class="header">
🚗 SHASSIHA INSPECTION
</div>

<div class="container">

<div class="card">

<h3>🔍 بحث رقم الشاصي</h3>

<input placeholder="رقم الشاصي">

<input placeholder="اسم السيارة">

<button>
بحث
</button>

</div>

<div class="card">

<h3>🧪 مخطط الصبغ التفاعلي</h3>

<div class="car-container">

<img src="car-top.png" class="car-image">

<div class="part hood" onclick="changeColor(this)">
Hood
</div>

<div class="part roof" onclick="changeColor(this)">
Roof
</div>

<div class="part trunk" onclick="changeColor(this)">
Trunk
</div>

<div class="part lf-fender" onclick="changeColor(this)">
LF Fender
</div>

<div class="part rf-fender" onclick="changeColor(this)">
RF Fender
</div>

<div class="part lf-door" onclick="changeColor(this)">
LF Door
</div>

<div class="part rf-door" onclick="changeColor(this)">
RF Door
</div>

<div class="part lr-door" onclick="changeColor(this)">
LR Door
</div>

<div class="part rr-door" onclick="changeColor(this)">
RR Door
</div>

<div class="part lr-fender" onclick="changeColor(this)">
LR Fender
</div>

<div class="part rr-fender" onclick="changeColor(this)">
RR Fender
</div>

</div>

<div class="legend">

<div class="legend-item">
<div class="color" style="background:#22c55e"></div>
<div>أصلي</div>
</div>

<div class="legend-item">
<div class="color" style="background:#eab308"></div>
<div>صبغ وكالة</div>
</div>

<div class="legend-item">
<div class="color" style="background:#f97316"></div>
<div>مرشوش</div>
</div>

<div class="legend-item">
<div class="color" style="background:#ef4444"></div>
<div>معجون</div>
</div>

</div>

<button onclick="window.print()">
🖨️ إنشاء / طباعة التقرير
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

    let current = getComputedStyle(element).backgroundColor;

    if(current == "rgb(34, 197, 94)"){
        element.style.background = "#eab308";
    }

    else if(current == "rgb(234, 179, 8)"){
        element.style.background = "#f97316";
    }

    else if(current == "rgb(249, 115, 22)"){
        element.style.background = "#ef4444";
    }

    else{
        element.style.background = "#22c55e";
    }
}

</script>

</body>
</html>
