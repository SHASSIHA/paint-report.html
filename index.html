<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    font-family:'Cairo',sans-serif;
    direction:rtl;
    color:white;
}

.container{
    max-width:430px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-top:20px;
    margin-bottom:20px;
}

/* CARD */

.card{
    background:#1f2937;
    border-radius:25px;
    padding:20px;
    margin-bottom:20px;
}

/* INPUTS */

.input{
    width:100%;
    background:#111827;
    border:none;
    padding:15px;
    border-radius:15px;
    color:white;
    margin-bottom:12px;
    font-size:15px;
}

.input::placeholder{
    color:#9ca3af;
}

/* CAR */

.car-area{
    position:relative;
    width:320px;
    height:560px;
    margin:auto;
    margin-top:20px;
    margin-bottom:30px;
}

.car-image{
    width:220px;
    display:block;
    margin:auto;
}

/* PARTS */

.part{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#22c55e;
    border:3px solid white;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

.part:hover{
    transform:scale(1.15);
}

.part:hover{
    transform:scale(1.05);
}

/* POSITIONS */

.hood{
    top:0px;
}

.roof{
    top:95px;
}

.trunk{
    bottom:0px;
}

.lf-fender{
    top:105px;
    left:0px;
}

.rf-fender{
    top:105px;
    right:0px;
}

.lf-door{
    top:200px;
    left:-5px;
}

.rf-door{
    top:200px;
    right:-5px;
}

.lr-door{
    top:295px;
    left:-5px;
}

.rr-door{
    top:295px;
    right:-5px;
}

.lr-fender{
    top:390px;
    left:0px;
}

.rr-fender{
    top:390px;
    right:0px;
}

/* LEGEND */

.legend{
    margin-top:15px;
}

.legend-item{
    display:flex;
    align-items:center;
    margin-bottom:10px;
}

.color{
    width:18px;
    height:18px;
    border-radius:50%;
    margin-left:10px;
}

/* NOTES */

.notes{
    width:100%;
    height:100px;
    background:#111827;
    border:none;
    border-radius:15px;
    padding:15px;
    color:white;
    resize:none;
    font-family:'Cairo',sans-serif;
}

/* BUTTON */

.btn{
    width:100%;
    background:#f97316;
    border:none;
    padding:16px;
    border-radius:18px;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:20px;
    cursor:pointer;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#6b7280;
    margin-top:20px;
    margin-bottom:20px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
🚗 SHASSIHA
</div>

<!-- INFO -->

<div class="card">

<input class="input" placeholder="رقم الشاصي VIN">

<input class="input" placeholder="اسم السيارة">

<input class="input" placeholder="الموديل">

<input class="input" placeholder="العداد / الممشى">

</div>

<!-- CAR -->

<div class="card">

<h3 style="margin-bottom:20px;">
مخطط الصبغ
</h3>

<div class="car-area">

<img src="car-top.png" class="car-image">

<div class="part hood" onclick="changeColor(this)"></div>

<div class="part roof" onclick="changeColor(this)"></div>

<div class="part trunk" onclick="changeColor(this)"></div>

<div class="part lf-fender" onclick="changeColor(this)"></div>

<div class="part rf-fender" onclick="changeColor(this)"></div>

<div class="part lf-door" onclick="changeColor(this)"></div>

<div class="part rf-door" onclick="changeColor(this)"></div>

<div class="part lr-door" onclick="changeColor(this)"></div>

<div class="part rr-door" onclick="changeColor(this)"></div>

<div class="part lr-fender" onclick="changeColor(this)"></div>

<div class="part rr-fender" onclick="changeColor(this)"></div>
<div class="part roof" onclick="changeColor(this)">
Roof
</div>

<div class="part trunk" onclick="changeColor(this)">
Trunk
</div>

<div class="part lf-fender" onclick="changeColor(this)">
LF Fender
</div>

<div class="part rf-fender" onclick="changeColor(this)">
RF Fender
</div>

<div class="part lf-door" onclick="changeColor(this)">
LF Door
</div>

<div class="part rf-door" onclick="changeColor(this)">
RF Door
</div>

<div class="part lr-door" onclick="changeColor(this)">
LR Door
</div>

<div class="part rr-door" onclick="changeColor(this)">
RR Door
</div>

<div class="part lr-fender" onclick="changeColor(this)">
LR Fender
</div>

<div class="part rr-fender" onclick="changeColor(this)">
RR Fender
</div>

</div>

<!-- LEGEND -->

<div class="legend">

<div class="legend-item">
<div class="color" style="background:#22c55e"></div>
أصلي
</div>

<div class="legend-item">
<div class="color" style="background:#eab308"></div>
صبغ وكالة
</div>

<div class="legend-item">
<div class="color" style="background:#f97316"></div>
مرشوش
</div>

<div class="legend-item">
<div class="color" style="background:#ef4444"></div>
معجون
</div>

</div>

</div>

<!-- NOTES -->

<div class="card">

<h3 style="margin-bottom:15px;">
ملاحظات
</h3>

<textarea class="notes" placeholder="اكتب الملاحظات هنا..."></textarea>

<button class="btn" onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

    let current = getComputedStyle(element).backgroundColor;

    if(current == "rgb(34, 197, 94)"){
        element.style.background = "#eab308";
    }

    else if(current == "rgb(234, 179, 8)"){
        element.style.background = "#f97316";
    }

    else if(current == "rgb(249, 115, 22)"){
        element.style.background = "#ef4444";
    }

    else{
        element.style.background = "#22c55e";
    }
}

</script>

</body>
</html>
