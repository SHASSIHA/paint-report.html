<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Inspection</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f3f4f6;
}

.header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}

.container{
    max-width:450px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin-top:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #ddd;
    margin-top:10px;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:#111827;
    color:white;
    font-size:16px;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.95;
}

.car-diagram{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.part{
    background:#22c55e;
    color:white;
    padding:15px;
    border-radius:14px;
    min-width:90px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
    user-select:none;
}

.part:hover{
    transform:scale(1.05);
}

.hood,
.roof,
.trunk{
    width:120px;
}

.legend{
    margin-top:20px;
    font-size:14px;
}

.legend div{
    margin-top:8px;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="header">
🚗 SHASSIHA INSPECTION
</div>

<div class="container">

<div class="card">

<h3>🔍 VIN Search</h3>

<input placeholder="رقم الشاصي">

<input placeholder="نوع السيارة">

<button>بحث</button>

</div>

<div class="card">

<h3>🧪 مخطط الصبغ</h3>

<div class="car-diagram">

    <div class="row">
        <div class="part hood" onclick="changeColor(this)">
            Hood
        </div>
    </div>

    <div class="row">
        <div class="part roof" onclick="changeColor(this)">
            Roof
        </div>
    </div>

    <div class="row">
        <div class="part" onclick="changeColor(this)">
            LF Fender
        </div>

        <div class="part" onclick="changeColor(this)">
            RF Fender
        </div>
    </div>

    <div class="row">
        <div class="part" onclick="changeColor(this)">
            LF Door
        </div>

        <div class="part" onclick="changeColor(this)">
            RF Door
        </div>
    </div>

    <div class="row">
        <div class="part" onclick="changeColor(this)">
            LR Door
        </div>

        <div class="part" onclick="changeColor(this)">
            RR Door
        </div>
    </div>

    <div class="row">
        <div class="part" onclick="changeColor(this)">
            LR Fender
        </div>

        <div class="part" onclick="changeColor(this)">
            RR Fender
        </div>
    </div>

    <div class="row">
        <div class="part trunk" onclick="changeColor(this)">
            Trunk
        </div>
    </div>

</div>

<div class="legend">

<div>🟢 Original</div>
<div>🟡 Agency Paint</div>
<div>🟠 Repainted</div>
<div>🔴 Body Filler</div>

</div>

<button onclick="window.print()">
🖨️ Generate Report
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

    let current = getComputedStyle(element).backgroundColor;

    if(current == "rgb(34, 197, 94)"){
        element.style.background = "#eab308";
    }

    else if(current == "rgb(234, 179, 8)"){
        element.style.background = "#f97316";
    }

    else if(current == "rgb(249, 115, 22)"){
        element.style.background = "#ef4444";
    }

    else{
        element.style.background = "#22c55e";
    }
}

</script>

</body>
</html>
