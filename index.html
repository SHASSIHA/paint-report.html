<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Inspection</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:'Cairo',sans-serif;
    direction:rtl;
    color:white;
}

.container{
    max-width:430px;
    margin:auto;
    padding:16px;
}

/* HEADER */

.header{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-top:20px;
    margin-bottom:20px;
}

/* CARD */

.card{
    background:#1e293b;
    border-radius:24px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

/* INPUTS */

.input{
    width:100%;
    background:#111827;
    border:none;
    border-radius:16px;
    padding:15px;
    color:white;
    font-size:15px;
    margin-bottom:12px;
    outline:none;
}

.input::placeholder{
    color:#94a3b8;
}

/* PARTS */

.parts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.part-card{
    background:#111827;
    border-radius:18px;
    padding:14px;
}

.part-name{
    font-size:14px;
    margin-bottom:10px;
    font-weight:600;
}

.select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    font-size:13px;
    outline:none;
}

/* NOTES */

.notes{
    width:100%;
    height:110px;
    background:#111827;
    border:none;
    border-radius:16px;
    padding:15px;
    color:white;
    resize:none;
    outline:none;
    font-family:'Cairo',sans-serif;
}

/* BUTTON */

.btn{
    width:100%;
    padding:17px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#f97316,#ea580c);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

/* STATUS COLORS */

.original{
    border-right:5px solid #22c55e;
}

.agency{
    border-right:5px solid #eab308;
}

.repaint{
    border-right:5px solid #f97316;
}

.putty{
    border-right:5px solid #ef4444;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#64748b;
    margin-top:20px;
    margin-bottom:20px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
🚗 SHASSIHA
</div>

<!-- INFO -->

<div class="card">

<div class="title">
معلومات السيارة
</div>

<input class="input" placeholder="رقم الشاصي VIN">

<input class="input" placeholder="اسم السيارة">

<input class="input" placeholder="الموديل">

<input class="input" placeholder="العداد / الممشى">

</div>

<!-- PARTS -->

<div class="card">

<div class="title">
فحص الصبغ
</div>

<div class="parts-grid">

<div class="part-card original">
<div class="part-name">Hood</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">LF Fender</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">RF Fender</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">LF Door</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">RF Door</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">LR Door</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">RR Door</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

<div class="part-card original">
<div class="part-name">Trunk</div>
<select class="select" onchange="changeStatus(this)">
<option>Original</option>
<option>Agency Paint</option>
<option>Repainted</option>
<option>Putty</option>
</select>
</div>

</div>

</div>

<!-- NOTES -->

<div class="card">

<div class="title">
ملاحظات
</div>

<textarea class="notes" placeholder="اكتب الملاحظات هنا..."></textarea>

<button class="btn" onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeStatus(select){

    let card = select.parentElement;

    card.classList.remove(
        "original",
        "agency",
        "repaint",
        "putty"
    );

    if(select.value == "Original"){
        card.classList.add("original");
    }

    else if(select.value == "Agency Paint"){
        card.classList.add("agency");
    }

    else if(select.value == "Repainted"){
        card.classList.add("repaint");
    }

    else{
        card.classList.add("putty");
    }

}

</script>

</body>
</html>
