<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Inspection</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:'Cairo',sans-serif;
    direction:rtl;
    color:white;
}

.container{
    max-width:430px;
    margin:auto;
    padding:14px;
}

/* HEADER */

.header{
    text-align:center;
    font-size:26px;
    font-weight:700;
    margin-top:15px;
    margin-bottom:15px;
}

/* CARD */

.card{
    background:#1e293b;
    border-radius:22px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.title{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

/* INPUTS */

.input{
    width:100%;
    background:#111827;
    border:none;
    border-radius:14px;
    padding:14px;
    color:white;
    font-size:14px;
    margin-bottom:10px;
    outline:none;
}

.input::placeholder{
    color:#94a3b8;
}

/* PARTS */

.parts{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.part{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111827;
    border-radius:14px;
    padding:12px 14px;
    border-right:6px solid #22c55e;
}

.part-name{
    font-size:14px;
    font-weight:600;
}

/* BUTTONS */

.status-buttons{
    display:flex;
    gap:6px;
}

.status-btn{
    width:24px;
    height:24px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid white;
}

.green{
    background:#22c55e;
}

.yellow{
    background:#eab308;
}

.orange{
    background:#f97316;
}

.red{
    background:#ef4444;
}

/* NOTES */

.notes{
    width:100%;
    height:90px;
    background:#111827;
    border:none;
    border-radius:14px;
    padding:16px;
    color:white;
    resize:none;
    outline:none;
    font-family:'Cairo',sans-serif;
}

/* BUTTON */

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#f97316,#ea580c);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#64748b;
    margin-top:10px;
    margin-bottom:15px;
    font-size:12px;
}

/* PRINT */

@media print{

    body{
        background:white;
    }

    .container{
        max-width:100%;
        padding:0;
    }

    .card{
        box-shadow:none;
        break-inside:avoid;
        page-break-inside:avoid;
    }

    .btn{
        display:none;
    }

    .footer{
        color:#000;
    }

    @page{
        size:auto;
        margin:10mm;
    }

}

</style>

</head>

<body>

</div>

</div>

<!-- NOTES -->

<div class="card">

<div class="title">
ملاحظات
</div>

<textarea class="notes" placeholder="اكتب الملاحظات هنا..."></textarea>

<button class="btn" onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function setColor(element,color){

    let part = element.closest('.part');

    part.style.borderRightColor = color;

}

</script>

</body>

</html>
