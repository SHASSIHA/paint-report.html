<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHASSIHA Premium Inspection</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:'Cairo',sans-serif;
    color:white;
    direction:rtl;
}

/* MAIN */

.container{
    max-width:430px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.logo{
    font-size:24px;
    font-weight:700;
}

.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

/* SEARCH */

.search-card{
    background:rgba(30,41,59,0.9);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:28px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.card-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:16px;
    background:#0f172a;
    border:none;
    border-radius:18px;
    color:white;
    margin-bottom:12px;
    font-size:15px;
    outline:none;
}

input::placeholder{
    color:#94a3b8;
}

.search-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#f97316,#ea580c);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

/* STATUS */

.status-card{
    margin-top:20px;
    background:rgba(30,41,59,0.9);
    backdrop-filter:blur(10px);
    border-radius:28px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.top-status{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.score-circle{
    width:85px;
    height:85px;
    border-radius:50%;
    background:conic-gradient(#22c55e 0% 85%, #334155 85% 100%);
    display:flex;
    align-items:center;
    justify-content:center;
}

.score-inner{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

.status-text h2{
    font-size:22px;
}

.status-text p{
    color:#94a3b8;
    margin-top:5px;
    font-size:14px;
}

/* CAR AREA */

.car-area{
    margin-top:35px;
    position:relative;
    display:flex;
    justify-content:center;
}

.car-image{
    width:220px;
    opacity:0.95;
    filter:drop-shadow(0 10px 25px rgba(0,0,0,0.4));
}

/* PARTS */

.part{
    position:absolute;
    background:#22c55e;
    color:white;
    padding:10px 12px;
    border-radius:14px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
    text-align:center;
    min-width:78px;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
}

.part:hover{
    transform:scale(1.06);
}

/* POSITIONS */

.hood{
    top:5px;
}

.roof{
    top:100px;
}

.trunk{
    bottom:0px;
}

.lf-fender{
    top:110px;
    left:-5px;
}

.rf-fender{
    top:110px;
    right:-5px;
}

.lf-door{
    top:210px;
    left:-10px;
}

.rf-door{
    top:210px;
    right:-10px;
}

.lr-door{
    top:315px;
    left:-10px;
}

.rr-door{
    top:315px;
    right:-10px;
}

.lr-fender{
    top:420px;
    left:-5px;
}

.rr-fender{
    top:420px;
    right:-5px;
}

/* LEGEND */

.legend{
    margin-top:35px;
}

.legend-title{
    margin-bottom:15px;
    font-size:18px;
    font-weight:700;
}

.legend-item{
    display:flex;
    align-items:center;
    margin-top:12px;
}

.legend-color{
    width:18px;
    height:18px;
    border-radius:50%;
    margin-left:10px;
}

/* BUTTON */

.report-btn{
    margin-top:30px;
}

.report-btn button{
    width:100%;
    padding:17px;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:35px;
    color:#64748b;
    font-size:13px;
    padding-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div class="logo">
🚗 SHASSIHA
</div>

<div class="profile">
👤
</div>

</div>

<!-- SEARCH -->

<div class="search-card">

<div class="card-title">
🔍 فحص السيارة
</div>

<input placeholder="أدخل رقم الشاصي VIN">

<input placeholder="اسم السيارة">

<button class="search-btn">
بحث الآن
</button>

</div>

<!-- STATUS -->

<div class="status-card">

<div class="top-status">

<div class="status-text">
<h2>حالة السيارة</h2>
<p>Original Paint Condition</p>
</div>

<div class="score-circle">

<div class="score-inner">
85%
</div>

</div>

</div>

<!-- CAR -->

<div class="car-area">

<img src="car-top.png" class="car-image">

<div class="part hood" onclick="changeColor(this)">
Hood
</div>

<div class="part roof" onclick="changeColor(this)">
Roof
</div>

<div class="part trunk" onclick="changeColor(this)">
Trunk
</div>

<div class="part lf-fender" onclick="changeColor(this)">
LF Fender
</div>

<div class="part rf-fender" onclick="changeColor(this)">
RF Fender
</div>

<div class="part lf-door" onclick="changeColor(this)">
LF Door
</div>

<div class="part rf-door" onclick="changeColor(this)">
RF Door
</div>

<div class="part lr-door" onclick="changeColor(this)">
LR Door
</div>

<div class="part rr-door" onclick="changeColor(this)">
RR Door
</div>

<div class="part lr-fender" onclick="changeColor(this)">
LR Fender
</div>

<div class="part rr-fender" onclick="changeColor(this)">
RR Fender
</div>

</div>

<!-- LEGEND -->

<div class="legend">

<div class="legend-title">
🧾 دليل الألوان
</div>

<div class="legend-item">
<div class="legend-color" style="background:#22c55e"></div>
أصلي
</div>

<div class="legend-item">
<div class="legend-color" style="background:#eab308"></div>
صبغ وكالة
</div>

<div class="legend-item">
<div class="legend-color" style="background:#f97316"></div>
مرشوش
</div>

<div class="legend-item">
<div class="legend-color" style="background:#ef4444"></div>
معجون
</div>

</div>

<!-- REPORT -->

<div class="report-btn">

<button onclick="window.print()">
🖨️ إنشاء التقرير
</button>

</div>

</div>

<div class="footer">
SHASSIHA © 2026
</div>

</div>

<script>

function changeColor(element){

    let current = getComputedStyle(element).backgroundColor;

    if(current == "rgb(34, 197, 94)"){
        element.style.background = "#eab308";
    }

    else if(current == "rgb(234, 179, 8)"){
        element.style.background = "#f97316";
    }

    else if(current == "rgb(249, 115, 22)"){
        element.style.background = "#ef4444";
    }

    else{
        element.style.background = "#22c55e";
    }
}

</script>

</body>
</html>
